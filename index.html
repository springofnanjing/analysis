function preprocessForOCR(img, box, keyName) {
  const scale = 3; 
  const canvas = document.createElement('canvas');
  canvas.width = box.w * scale;
  canvas.height = box.h * scale;
  
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, box.x, box.y, box.w, box.h, 0, 0, canvas.width, canvas.height);

  const debugList = document.getElementById('debugList');
  if (debugList) {
    const wrapper = document.createElement('div');
    wrapper.className = 'debug-item';
    wrapper.appendChild(canvas);
    const label = document.createElement('div');
    label.innerText = keyName;
    wrapper.appendChild(label);
    debugList.appendChild(wrapper);
  }
  return canvas;
}

const loadedTemplates = {};

async function loadTroopTemplates() {
  const promises = Object.entries(TROOP_TEMPLATES).map(([name, url]) => {
    return new Promise((resolve) => {
      const img = new Image();
      img.src = url;
      const timer = setTimeout(() => resolve(), 1500);

      img.onload = () => {
        clearTimeout(timer);
        try {
          const cvs = document.createElement('canvas');
          cvs.width = 40; cvs.height = 40;
          const ctx = cvs.getContext('2d');
          ctx.drawImage(img, 0, 0, 40, 40);
          const imgData = ctx.getImageData(0, 0, 40, 40);
          const d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            const gray = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
            const v = gray > 110 ? 255 : 0;
            d[i] = v; d[i+1] = v; d[i+2] = v;
          }
          loadedTemplates[name] = d;
        } catch (e) {}
        resolve();
      };
      img.onerror = () => { clearTimeout(timer); resolve(); };
    });
  });
  await Promise.all(promises);
}

function matchTroopType(croppedCanvas) {
  try {
    if (!loadedTemplates || Object.keys(loadedTemplates).length === 0) return "미상";
    const cvs40 = document.createElement('canvas');
    cvs40.width = 40; cvs40.height = 40;
    const ctx40 = cvs40.getContext('2d');
    ctx40.drawImage(croppedCanvas, 0, 0, 40, 40);
    const imgData = ctx40.getImageData(0, 0, 40, 40);
    const targetData = imgData.data;

    for (let i = 0; i < targetData.length; i += 4) {
      const gray = targetData[i]*0.299 + targetData[i+1]*0.587 + targetData[i+2]*0.114;
      const v = gray > 110 ? 255 : 0;
      targetData[i] = v; targetData[i+1] = v; targetData[i+2] = v;
    }

    let bestMatch = "미상";
    let minDiff = Infinity;

    for (const [name, templateData] of Object.entries(loadedTemplates)) {
      let diff = 0;
      for (let i = 0; i < targetData.length; i += 4) {
        diff += Math.abs(targetData[i] - templateData[i]);
      }
      if (diff < minDiff) { minDiff = diff; bestMatch = name; }
    }
    return bestMatch;
  } catch (err) {
    return "미상";
  }
}

function parseHeroName(text) {
  const clean = text.replace(/[^가-힣]/g, '');
  const match = clean.match(/[가-힣]{2,3}/);
  const parsed = match ? match[0] : clean;
  return HERO_LIST.includes(parsed) ? parsed : "";
}

function parseTacticName(text) {
  const cleanTarget = text.replace(/[^가-힣a-zA-Z0-9]/g, '');
  if (!cleanTarget) return "";

  for (const tactic of TACTIC_LIST) {
    const cleanCandidate = tactic.replace(/[^가-힣a-zA-Z0-9]/g, '');
    if (cleanCandidate === cleanTarget || cleanCandidate.includes(cleanTarget) || cleanTarget.includes(cleanCandidate)) {
      return tactic;
    }
  }
  return "";
}

async function processReport() {
  const fileInput = document.getElementById('imageInput');
  const btn = document.getElementById('processBtn');
  const debugList = document.getElementById('debugList');
  const editFormArea = document.getElementById('editFormArea');

  if (!fileInput.files[0]) {
    alert("이미지 파일을 선택해주세요.");
    return;
  }

  btn.disabled = true;
  document.getElementById('log').innerText = "분석 시작...";
  if (debugList) debugList.innerHTML = "";
  editFormArea.style.display = "none";

  const file = fileInput.files[0];
  const img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = async () => {
    log("병종 템플릿 로드 중...");
    await loadTroopTemplates();

    log("Tesseract OCR 엔진 준비 중...");
    const worker = await Tesseract.createWorker('kor');

    const nickCvs = preprocessForOCR(img, CROP_BOXES.nickname, '닉네임');
    const formCvs = preprocessForOCR(img, CROP_BOXES.formation, '진형');
    
    const resNick = await worker.recognize(nickCvs);
    const resForm = await worker.recognize(formCvs);

    const enemyName = resNick.data.text.replace(/[^가-힣a-zA-Z0-9]/g, '').trim();
    const rawFormText = resForm.data.text.replace(/[^가-힣]/g, '').trim();
    const formMatch = rawFormText.match(/[가-힣]{1,4}진/);
    const formation = formMatch ? formMatch[0] : rawFormText;

    const h1_troop = matchTroopType(preprocessForOCR(img, CROP_BOXES.h1_troop, '병종1'));
    const h2_troop = matchTroopType(preprocessForOCR(img, CROP_BOXES.h2_troop, '병종2'));
    const h3_troop = matchTroopType(preprocessForOCR(img, CROP_BOXES.h3_troop, '병종3'));

    const resH1 = await worker.recognize(preprocessForOCR(img, CROP_BOXES.h1_name, '장수1'));
    const resH2 = await worker.recognize(preprocessForOCR(img, CROP_BOXES.h2_name, '장수2'));
    const resH3 = await worker.recognize(preprocessForOCR(img, CROP_BOXES.h3_name, '장수3'));

    const h1_name = parseHeroName(resH1.data.text);
    const h2_name = parseHeroName(resH2.data.text);
    const h3_name = parseHeroName(resH3.data.text);

    // 💡 고유전법(t1)은 OCR 대상에서 제외하고, 2, 3번째 전법(t2, t3)만 OCR 분석 진행
    const tKeys = ['h1_t2', 'h1_t3', 'h2_t2', 'h2_t3', 'h3_t2', 'h3_t3'];
    const tResults = {};

    for (const key of tKeys) {
      const tacCvs = preprocessForOCR(img, CROP_BOXES[key], key);
      const res = await worker.recognize(tacCvs);
      tResults[key] = parseTacticName(res.data.text);
    }
    
    await worker.terminate();

    document.getElementById('edit_enemy_name').value = enemyName;
    document.getElementById('edit_formation').value = formation;
    
    document.getElementById('edit_h1_troop').value = h1_troop;
    document.getElementById('edit_h1_name').value = h1_name;
    document.getElementById('edit_h1_t1').value = UNIQUE_TACTICS[h1_name] || "";
    document.getElementById('edit_h1_t2').value = tResults['h1_t2'];
    document.getElementById('edit_h1_t3').value = tResults['h1_t3'];

    document.getElementById('edit_h2_troop').value = h2_troop;
    document.getElementById('edit_h2_name').value = h2_name;
    document.getElementById('edit_h2_t1').value = UNIQUE_TACTICS[h2_name] || "";
    document.getElementById('edit_h2_t2').value = tResults['h2_t2'];
    document.getElementById('edit_h2_t3').value = tResults['h2_t3'];

    document.getElementById('edit_h3_troop').value = h3_troop;
    document.getElementById('edit_h3_name').value = h3_name;
    document.getElementById('edit_h3_t1').value = UNIQUE_TACTICS[h3_name] || "";
    document.getElementById('edit_h3_t2').value = tResults['h3_t2'];
    document.getElementById('edit_h3_t3').value = tResults['h3_t3'];

    editFormArea.style.display = "block";
    log("✨ 분석 완료! 장수 이름 기반 고유전법 자동 반영 완료.");
    btn.disabled = false;
  };
}

async function sendToSheet() {
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  const payload = {
    enemy_name: document.getElementById('edit_enemy_name').value,
    formation: document.getElementById('edit_formation').value,
    
    h1_troop: document.getElementById('edit_h1_troop').value, 
    h1_name: document.getElementById('edit_h1_name').value, 
    h1_t1: document.getElementById('edit_h1_t1').value, 
    h1_t2: document.getElementById('edit_h1_t2').value, 
    h1_t3: document.getElementById('edit_h1_t3').value,
    
    h2_troop: document.getElementById('edit_h2_troop').value, 
    h2_name: document.getElementById('edit_h2_name').value, 
    h2_t1: document.getElementById('edit_h2_t1').value, 
    h2_t2: document.getElementById('edit_h2_t2').value, 
    h2_t3: document.getElementById('edit_h2_t3').value,
    
    h3_troop: document.getElementById('edit_h3_troop').value, 
    h3_name: document.getElementById('edit_h3_name').value, 
    h3_t1: document.getElementById('edit_h3_t1').value, 
    h3_t2: document.getElementById('edit_h3_t2').value, 
    h3_t3: document.getElementById('edit_h3_t3').value
  };

  log("구글 시트로 수정된 데이터 전송 중...");

  try {
    await fetch(GOOGLE_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ payload: JSON.stringify(payload) })
    });
    log("✅ 구글 시트 전송 완료!");
    alert("시트 전송이 완료되었습니다.");
  } catch (err) {
    log("❌ 전송 에러: " + err);
  } finally {
    sendBtn.disabled = false;
  }
}
